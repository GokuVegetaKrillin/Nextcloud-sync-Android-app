name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permissions for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          # If gradlew exists at root, use it; otherwise use gradle 8.7
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          elif [ -f "./settings.gradle.kts" ] || [ -f "./settings.gradle" ]; then
            gradle assembleDebug --stacktrace
          else
            # Search if project was placed in a subfolder
            SETTINGS_DIR=$(find . -maxdepth 2 -name "settings.gradle*" -exec dirname {} \;)
            if [ -n "$SETTINGS_DIR" ]; then
              echo "Found Gradle project in $SETTINGS_DIR"
              cd "$SETTINGS_DIR"
              gradle assembleDebug --stacktrace
            else
              echo "ERROR: Could not find settings.gradle.kts anywhere in repo!"
              ls -la
              exit 1
            fi
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nextcloud-Sync-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
